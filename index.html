<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
  <title>Weather Application</title>
</head>

<body>
  <div class="container">
    <header>
      <form class="search-form" id="search-form">
        <input type="search" placeholder="Enter a city.." required id="search-form-input" class="search-form-input" />
        <input type="submit" value="Search" class="search-form-button" />
      </form>
    </header>
    <main>
      <div class="weather-container">
        <div>
          <h1 class="weather-city" id="city"></h1>
          <p class="weather-details">
            <span id="time"></span>
            <span id="description"></span>
            <br />
            Humidity: <strong id="humidity"></strong> , Wind:
            <strong id="wind-speed"></strong>
          </p>
        </div>
        <div class="temperature-container">
          <div class="icon" id="icon">
          </div>
          <div class="current-temperature" id="temperature"></div>
          <div class="unit">°C</div>
        </div>
      </div>
      <div class="weather-forecast" id="forecast">
        <div class="forecast-day">
          <div class="forecast-date">Wed</div>
          <img src="" alt="" class="forecast-icon">
          <div class="forecast-temperatures">
            <div class="forecast-temperature"><strong>18°</strong></div>
            <div class="forecast-temperature">10°</div>
          </div>
        </div>
        <div class="forecast-day">
          <div class="forecast-date">Thu</div>
          <img src="" alt="" class="forecast-icon">
          <div class="forecast-temperatures">
            <div class="forecast-temperature"><strong></strong></div>
            <div class="forecast-temperature"></div>
          </div>
        </div>
        <div class="forecast-day">
          <div class="forecast-date">Fri</div>
          <img src="" alt="" class="forecast-icon">
          <div class="forecast-temperatures">
            <div class="forecast-temperature"><strong></strong></div>
            <div class="forecast-temperature"></div>
          </div>
        </div>
        <div class="forecast-day">
          <div class="forecast-date">Sat</div>
          <img src="" alt="" class="forecast-icon">
          <div class="forecast-temperatures">
            <div class="forecast-temperature"><strong></strong></div>
            <div class="forecast-temperature"></div>
          </div>
        </div>
        <div class="forecast-day">
          <div class="forecast-date">Sun</div>
          <img src="" alt="" class="forecast-icon">
          <div class="forecast-temperatures">
            <div class="forecast-temperature"><strong></strong></div>
            <div class="forecast-temperature"></div>
          </div>
        </div>
      </div>
    </main>
    <footer>
      This project was coded by <a href="https://github.com/anachicaiza" target="_blank">Ana Chicaiza</a>, is
      open-sourced
      in <a href="https://github.com/anachicaiza/Weather_app" target="_blank">GitHub</a> and hosted on <a
        href="https://shecodes-weather-application-project.netlify.app" target="_blank">Netlify</a>
    </footer>
  </div>
  <script src="index.js"></script>
</body>

</html>
